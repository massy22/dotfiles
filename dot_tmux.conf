#------------------------------------------------------------------------------
# Basic
#------------------------------------------------------------------------------
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g automatic-rename off
set -g focus-events on
setw -g mode-keys vi

#------------------------------------------------------------------------------
# Terminal
#------------------------------------------------------------------------------
# 内側の TERM。tmux-256color の terminfo が無い環境では退避する。
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# 外側の端末に対して追加で有効化する能力。RGB は 24bit 色で、旧
# terminal-overrides の Tc の後継。extkeys は tmux が拡張キー
# (Shift+Enter など) を端末とやり取りするための宣言。
set -as terminal-features ",xterm*:RGB:extkeys"
set -as terminal-features ",ghostty*:RGB:extkeys"

# 内側のアプリ (Claude Code など) を外側の端末に直結させる。
# - allow-passthrough: 通知や進捗バーの OSC を tmux が飲まずに素通しする
# - extended-keys: Shift+Enter を Enter と区別して渡す (複数行入力)
# - set-clipboard: アプリ発の OSC 52 を受けて外側のクリップボードへ書く
#   (既定の external はアプリ発を無視するため /copy が届かない)
set -g allow-passthrough on
set -s extended-keys on
set -s set-clipboard on

#------------------------------------------------------------------------------
# Status line
#------------------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
# 配色。帯の背景 #121212 はニュートラルな黒で、これは端末テーマの色ではない。
# tokyonight の暗色 (#1f2335 等) と入れ替えると背景との明度差は変わらないまま
# 「ニュートラル黒 vs 青みがかった暗色」という色味の差だけを失い、帯の輪郭が
# ぼやける。アクセント #3b4261 は tokyonight bg_visual (色相 229°) で、この上に
# 載る白・cyan・橙・緑がすべて 4.5:1 以上になる唯一の候補。
#   #a9b1d6 fg_dark  #c0caf5 fg      #15161e black     #3b4261 bg_visual
#   #292e42 bg_hl    #1f2335 bg_dark #414868 term_black #bb9af7 magenta
#
# #{?...} の分岐内では , を含む #[fg=...,bg=...] を使えない。tmux が引数区切りと
# 解釈して分岐ごと消える (以前ここで PREFIX 表示とセパレータが出なくなっていた)。
# 分岐内は #[fg=x]#[bg=y] のように 1 属性ずつ書く。
set -g status-style "fg=#a9b1d6,bg=#121212"
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=#15161e,bg=#c0caf5,bold] #S #{?client_prefix,#[fg=#c0caf5]#[bg=#bb9af7]#[fg=#15161e]#[bg=#bb9af7] PREFIX #[fg=#bb9af7]#[bg=#121212],#[fg=#c0caf5]#[bg=#121212]}"
set -g status-right "#[fg=#292e42,bg=#121212]#[fg=#c0caf5,bg=#292e42] #(sysctl -n vm.loadavg 2>/dev/null | awk '{print $2, $3, $4}' | tr -d '{}') #[fg=#1f2335,bg=#292e42]#[fg=#c0caf5,bg=#1f2335] %Y-%m-%d #[fg=#3b4261,bg=#1f2335]#[fg=#7dcfff,bg=#3b4261] %H:%M #[fg=#c0caf5,bg=#3b4261]#[fg=#15161e,bg=#c0caf5,bold] #H "

setw -g window-status-separator "#[fg=#414868,bg=#121212]  "
# #I の後ろに Claude Code の状態を出す (@cc は hook から
# ~/.claude/tmux-claude-state.sh が書き込む)。
#   ● 橙 = 承認/入力待ち, ● 緑 = 応答完了, ◌ 青 = 実行中
setw -g window-status-format "#[fg=#a9b1d6,bg=#121212] #I #{?#{==:#{@cc},wait},#[fg=#e0af68]● ,#{?#{==:#{@cc},done},#[fg=#9ece6a]● ,#{?#{==:#{@cc},busy},#[fg=#7dcfff]◌ ,}}}#[fg=#414868]#[fg=#a9b1d6] #W"
setw -g window-status-current-format "#[fg=#121212,bg=#3b4261]#[fg=#7dcfff,bg=#3b4261] #I #{?#{==:#{@cc},wait},#[fg=#e0af68]● ,#{?#{==:#{@cc},done},#[fg=#9ece6a]● ,#{?#{==:#{@cc},busy},#[fg=#7dcfff]◌ ,}}}#[fg=#c0caf5]#[fg=#ffffff,bg=#3b4261,bold] #W #[fg=#3b4261,bg=#121212]"
setw -g window-status-style "fg=#a9b1d6,bg=#121212"
setw -g window-status-current-style "fg=#ffffff,bg=#3b4261,bold"
setw -g mode-style "fg=#15161e,bg=#c0caf5"

#------------------------------------------------------------------------------
# Copy mode
#------------------------------------------------------------------------------
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi'"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; elif command -v xclip >/dev/null 2>&1; then xclip -selection clipboard -in; else cat >/dev/null; fi'"

#------------------------------------------------------------------------------
# Prefix and screen-like bindings
#------------------------------------------------------------------------------
unbind C-b
set -g prefix C-t
bind t send-prefix

unbind C-c
bind C-c new-window -n zsh
bind c new-window -n zsh

unbind C-d
bind C-d detach

unbind C-a
bind C-a last-window

unbind "*"
bind "*" list-clients

unbind A
bind A command-prompt "rename-window %%"

unbind C-[
bind -r C-[ copy-mode
unbind C-]
bind -r C-] paste-buffer

unbind C-@
bind C-@ next-window
unbind C-n
bind C-n next-window
unbind Space
bind Space next-window
unbind n
bind n next-window

unbind BSpace
bind BSpace previous-window

unbind C-w
bind C-w list-windows
unbind w
bind w list-windows

unbind "\\"
bind "\\" confirm-before "kill-server"

unbind K
bind K confirm-before "kill-window"
unbind k
bind k confirm-before "kill-window"

#------------------------------------------------------------------------------
# Claude Code
#------------------------------------------------------------------------------
# 入力待ち (無ければ応答完了) の Claude がいるウィンドウへ移動する
bind C-j run-shell -b '~/.local/bin/tmux-claude-next'

#------------------------------------------------------------------------------
# Panes and windows
#------------------------------------------------------------------------------
bind | split-window -h \; select-layout even-horizontal
bind - split-window -v \; select-layout even-vertical

unbind Tab
bind Tab select-pane -t :.-
unbind BTab
bind BTab select-pane -t :.+
unbind C-h
bind C-h select-pane -t :.-
unbind h
bind h select-pane -t :.-
unbind C-l
bind C-l select-pane -t :.+
unbind l
bind l select-pane -t :.+

#------------------------------------------------------------------------------
# Reload
#------------------------------------------------------------------------------
unbind r
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
unbind R
bind R refresh-client
