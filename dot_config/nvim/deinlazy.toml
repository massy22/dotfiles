# ==========================================================
# programming
# ==========================================================

# golang
[[plugins]]
repo = 'fatih/vim-go'
on_ft = 'go'
hook_source = 'source ~/.config/nvim/plugins/vim-go.rc.vim'
hook_post_source = 'source ~/.config/nvim/plugins/vim-go.post.rc.vim'

# ruby
[[plugins]]
repo = 'tpope/vim-rails'
on_ft = 'ruby'

# crystal
[[plugins]]
repo = 'rhysd/vim-crystal'
on_ft = 'crystal'

# slim
[[plugins]]
repo = 'slim-template/vim-slim'
on_ft = 'slim'
